name: Great Merge Builds

on:
  workflow_dispatch:
  push:
    branches: [release/great-merge]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: yarn
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm zip
      - run: yarn install --frozen-lockfile
      - run: yarn make
      - uses: actions/upload-artifact@v4
        with:
          name: kenku-fm-${{ runner.os }}-${{ runner.arch }}
          path: out/make/**/*
          if-no-files-found: error
          retention-days: 14
